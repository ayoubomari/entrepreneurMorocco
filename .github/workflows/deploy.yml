name: Deploy

on:
  push:
    branches:
      - claude

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/entrepreneur-morocco
            git fetch origin
            git checkout claude
            git reset --hard origin/claude
            git clean -fd
            npm ci
            npm run build
            pm2 delete entrepreneur-morocco || true
            PORT=3002 pm2 start npm --name "entrepreneur-morocco" -- start
            pm2 save
