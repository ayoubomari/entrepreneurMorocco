name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /root/entrepreneurMorocco
            git pull origin main
            npm ci
            npm run build
            pm2 delete entrepreneurMorocco || true
            PORT=3002 pm2 start npm --name "entrepreneurMorocco" -- start
            pm2 save
